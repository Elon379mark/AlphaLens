apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: alphalens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.10.0
        command:
        - mlflow
        - server
        - --host
        - 0.0.0.0
        - --port
        - "5000"
        - --backend-store-uri
        - postgresql://postgres:postgres@timescaledb.alphalens.svc.cluster.local:5432/alphalens
        - --default-artifact-root
        - /mlflow/artifacts
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: mlflow-artifacts
          mountPath: /mlflow/artifacts
      volumes:
      - name: mlflow-artifacts
        persistentVolumeClaim:
          claimName: mlflow-artifacts-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts-pvc
  namespace: alphalens
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: gp3

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: alphalens
spec:
  selector:
    app: mlflow-server
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  type: ClusterIP
